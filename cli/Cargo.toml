[package]
name = "rufus-rust"
version = "0.1.0"
edition = "2024"
description = "Fast, safe, and open-source bootable USB creator (Rufus/DROFUS alternative written in Rust)"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
indicatif = { version = "0.17", default-features = false }
sha2 = { version = "0.10", default-features = false }
console = { version = "0.15", default-features = false, features = ["ansi-parsing"] }
anyhow = { version = "1.0", default-features = false, features = ["std"] }
eframe = { version = "0.37", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = { version = "0.18", optional = true, default-features = false, features = ["xdg-portal"] }

[features]
default = []
desktop = ["dep:eframe", "dep:rfd"]

[[bin]]
name = "isoload"
path = "src/main.rs"

[[bin]]
name = "isoload-gui"
path = "src/gui.rs"
required-features = ["desktop"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
